[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-lag-fixer"
version = "1.1.0"
description = "ALFi - Android Lag Fixer: Safe, non-root Android performance optimizer (Low/Medium/High/Ultra), debloater & malware auditor over ADB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "pavnxet" }
]
keywords = [
    "alfi",
    "android-lag-fixer",
    "android",
    "lag-fix",
    "debloater",
    "adb",
    "performance",
    "optimization",
    "hyperos",
    "miui",
    "oneui",
    "coloros"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: Utilities"
]
dependencies = []

[project.scripts]
alfi = "scripts.wizard:main"
alfi-wizard = "scripts.wizard:main"
alfi-modes = "scripts.modes:main"
alfi-power = "scripts.power_audit:main"
alfi-doze = "scripts.doze_boost:main"
alfi-rescue = "scripts.rescue:main"
alfi-bench = "scripts.bench:main"
alfi-shizuku = "scripts.export_shizuku:main"
alfi-update = "scripts.update_database:main"
lagfixer = "scripts.wizard:main"
lagfixer-wizard = "scripts.wizard:main"
lagfixer-modes = "scripts.modes:main"
lagfixer-power = "scripts.power_audit:main"
lagfixer-doze = "scripts.doze_boost:main"
lagfixer-rescue = "scripts.rescue:main"
lagfixer-bench = "scripts.bench:main"
lagfixer-shizuku = "scripts.export_shizuku:main"
lagfixer-update = "scripts.update_database:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.urls]
Homepage = "https://github.com/pavnxet/android-lag-fixer"
Issues = "https://github.com/pavnxet/android-lag-fixer/issues"
